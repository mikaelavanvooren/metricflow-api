# The /api/v1/security/** endpoints publish a list of this application's own unpatched
# advisories, which is reconnaissance material and is not protected by authentication.
# They are therefore enabled only in this development profile:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
metricflow.security.enabled=true

# Scan history lives outside target/ so that `mvn clean` does not delete the baseline that the
# /api/v1/security/diff endpoint compares against.
metricflow.security.snapshot-dir=.metricflow/security-snapshots
