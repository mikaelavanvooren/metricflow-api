spring.application.name=metricflow-api
spring.datasource.url=jdbc:h2:mem:metricflow
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
# Jackson 3 sorts properties alphabetically by default, which would reorder every JSON
# response relative to Boot 2.x. Kept off so the response field order stays declaration-order
# for existing clients.
spring.jackson.mapper.sort-properties-alphabetically=false
