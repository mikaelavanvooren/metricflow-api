spring.application.name=metricflow-api
spring.datasource.url=jdbc:h2:mem:metricflow
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
springfox.documentation.swagger-ui.enabled=true
# springfox 3.0.0 cannot introspect Boot 2.6+ PathPatternParser mappings; without this the
# documentationPluginsBootstrapper bean fails on startup.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
